[project]
name = "tinymcp"
version = "0.1.0"
description = "Minimal MCP server and transport helpers — stdlib only, no SDK dependency."
readme = "README.md"
authors = [
    { name = "Juan Jose Garcia-Ripoll", email = "juanjose.garciaripoll@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "basedpyright>=1.17",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ARG", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
